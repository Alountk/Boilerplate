# Local development stack
# Services: API (.NET) + Web (Next.js)
# Note: this file builds local images and should not be used as a Portainer/GitOps deploy stack.

services:
  api:
    image: ${API_IMAGE_TAG:-videogames-api:latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-5017}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:-VideogamesAPI}
      - JwtSettings__Audience=${JWT_AUDIENCE:-VideogamesClient}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Minio__Endpoint=${MINIO_ENDPOINT}
      - Minio__User=${MINIO_USER}
      - Minio__Secret=${MINIO_SECRET}
      - Minio__BucketName=${MINIO_BUCKET:-videogames}
      - Minio__UseSSL=${MINIO_USE_SSL:-false}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__From=${SMTP_FROM:-}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
    networks:
      - app-network

  web:
    image: ${WEB_IMAGE_TAG:-videogames-web:latest}
    restart: unless-stopped
    build:
      context: ./Videogames.Web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-local-dev}
        NEXT_PUBLIC_IMAGE_BASE_URL: ${NEXT_PUBLIC_IMAGE_BASE_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    depends_on:
      - api

networks:
  app-network:
    driver: bridge
