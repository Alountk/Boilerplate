# Managed by .github/workflows/docker-release.yml.
# Arcane/Portainer should deploy this file instead of docker-compose.deploy.yml
# when you want the environment to follow the exact image version published by CI.

services:
  api:
    image: ghcr.io/alountk/vmarket-api:main-42-1e00732
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${API_PORT:-5017}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:-VideogamesAPI}
      - JwtSettings__Audience=${JWT_AUDIENCE:-VideogamesClient}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Minio__Endpoint=${MINIO_ENDPOINT}
      - Minio__User=${MINIO_USER}
      - Minio__Secret=${MINIO_SECRET}
      - Minio__BucketName=${MINIO_BUCKET:-videogames}
      - Minio__UseSSL=${MINIO_USE_SSL:-false}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__From=${SMTP_FROM:-}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
    networks:
      - app-network

  web:
    image: ghcr.io/alountk/vmarket-web:main-42-1e00732
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    depends_on:
      - api

networks:
  app-network:
    driver: bridge
