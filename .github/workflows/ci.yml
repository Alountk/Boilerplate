name: CI Pipeline

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-ci:
    name: Backend CI (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Videogames.sln

      - name: Build
        run: dotnet build Videogames.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test Videogames.sln --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend CI (Next.js & Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Videogames.Web/package-lock.json

      # - name: Install dependencies
      #   working-directory: Videogames.Web
      #   run: npm ci
      - name: Install dependencies VERBOSE
        working-directory: Videogames.Web
        run: |
          node -v
          npm -v
          npm config get registry
          npm ci --verbose

      - name: Lint
        working-directory: Videogames.Web
        run: npm run lint

      - name: Install Playwright Browsers
        working-directory: Videogames.Web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: Videogames.Web
        continue-on-error: true
        run: npm run test:e2e
        env:
          # Ensuring Playwright handles the webserver internally via config
          CI: true

      - name: Summarize Playwright results
        if: always()
        working-directory: Videogames.Web
        shell: bash
        run: |
          if [ -f "test-results/.last-run.json" ]; then
            echo "Playwright .last-run.json:"
            cat test-results/.last-run.json
            node -e "const fs=require('fs');const p='test-results/.last-run.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.status&&d.status!=='passed'){console.log('::warning::Playwright finished with status='+d.status);}"
          else
            echo "::warning::No Playwright .last-run.json found in Videogames.Web/test-results"
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Videogames.Web/test-results/
          retention-days: 30
