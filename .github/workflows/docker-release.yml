name: Docker Release (Main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute app version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_VERSION="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed APP_VERSION=${APP_VERSION}"

      - name: Compute lowercase image names
        id: image
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api_image=${OWNER_LC}/vmarket-api" >> "$GITHUB_OUTPUT"
          echo "web_image=${OWNER_LC}/vmarket-web" >> "$GITHUB_OUTPUT"
          echo "API image: ${OWNER_LC}/vmarket-api"
          echo "WEB image: ${OWNER_LC}/vmarket-web"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:main-latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./Videogames.Web
          file: ./Videogames.Web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:main-latest

      - name: Release summary
        run: |
          echo "Published version: ${{ steps.version.outputs.app_version }}"
          echo "API: ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}"
          echo "WEB: ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}"
