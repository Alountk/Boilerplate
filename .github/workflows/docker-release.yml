name: Docker Release (Main)

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/arcane-stack.yml
      - deploy/release.json

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute app version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_VERSION="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed APP_VERSION=${APP_VERSION}"

      - name: Compute lowercase image names
        id: image
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api_image=${OWNER_LC}/vmarket-api" >> "$GITHUB_OUTPUT"
          echo "web_image=${OWNER_LC}/vmarket-web" >> "$GITHUB_OUTPUT"
          echo "API image: ${OWNER_LC}/vmarket-api"
          echo "WEB image: ${OWNER_LC}/vmarket-web"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate web build variables
        shell: bash
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}"
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "ERROR: Missing repository variable NEXT_PUBLIC_API_URL" >&2
            echo "Set it in GitHub Settings -> Secrets and variables -> Actions -> Variables" >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_IMAGE_BASE_URL=${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}"
          if [ -z "${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}" ]; then
            echo "ERROR: Missing repository variable NEXT_PUBLIC_IMAGE_BASE_URL" >&2
            echo "Set it in GitHub Settings -> Secrets and variables -> Actions -> Variables" >&2
            exit 1
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:main-latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./Videogames.Web
          file: ./Videogames.Web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.app_version }}
            NEXT_PUBLIC_IMAGE_BASE_URL=${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:main-latest

      - name: Release summary
        run: |
          echo "Published version: ${{ steps.version.outputs.app_version }}"
          echo "API: ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}"
          echo "WEB: ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}"

      - name: Render Arcane release files
        shell: bash
        run: |
          mkdir -p deploy

          cat > deploy/arcane-stack.yml <<EOF
          # Managed by .github/workflows/docker-release.yml.
          # Arcane/Portainer should deploy this file instead of docker-compose.deploy.yml
          # when you want the environment to follow the exact image version published by CI.

          services:
            api:
              image: ${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}
              pull_policy: always
              restart: unless-stopped
              ports:
                - "\${API_PORT:-5017}:8080"
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ASPNETCORE_URLS=http://+:8080
                - ConnectionStrings__DefaultConnection=\${CONNECTION_STRING}
                - JwtSettings__Secret=\${JWT_SECRET}
                - JwtSettings__Issuer=\${JWT_ISSUER:-VideogamesAPI}
                - JwtSettings__Audience=\${JWT_AUDIENCE:-VideogamesClient}
                - JwtSettings__ExpiryMinutes=\${JWT_EXPIRY_MINUTES:-60}
                - Minio__Endpoint=\${MINIO_ENDPOINT}
                - Minio__User=\${MINIO_USER}
                - Minio__Secret=\${MINIO_SECRET}
                - Minio__BucketName=\${MINIO_BUCKET:-videogames}
                - Minio__UseSSL=\${MINIO_USE_SSL:-false}
                - Smtp__Host=\${SMTP_HOST:-}
                - Smtp__Port=\${SMTP_PORT:-587}
                - Smtp__From=\${SMTP_FROM:-}
                - Smtp__User=\${SMTP_USER:-}
                - Smtp__Password=\${SMTP_PASSWORD:-}
                - Smtp__EnableSsl=\${SMTP_ENABLE_SSL:-true}
                - CORS_ALLOWED_ORIGINS=\${CORS_ALLOWED_ORIGINS:-}
              networks:
                - app-network

            web:
              image: ${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}
              pull_policy: always
              restart: unless-stopped
              ports:
                - "\${WEB_PORT:-3000}:3000"
              environment:
                - NODE_ENV=production
              networks:
                - app-network
              depends_on:
                - api

          networks:
            app-network:
              driver: bridge
          EOF

          cat > deploy/release.json <<EOF
          {
            "appVersion": "${{ steps.version.outputs.app_version }}",
            "gitSha": "${{ github.sha }}",
            "apiImage": "${{ env.REGISTRY }}/${{ steps.image.outputs.api_image }}:${{ steps.version.outputs.app_version }}",
            "webImage": "${{ env.REGISTRY }}/${{ steps.image.outputs.web_image }}:${{ steps.version.outputs.app_version }}"
          }
          EOF

      - name: Commit Arcane release files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- deploy/arcane-stack.yml deploy/release.json)" ]; then
            echo "No Arcane release file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/arcane-stack.yml deploy/release.json
          git commit -m "chore: update Arcane release manifest for ${{ steps.version.outputs.app_version }}"
          git push origin HEAD:main
